# Supabase Local Configuration for ScamShield
project_id = "scamshield"

[api]
port = 54321
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000/*", "chrome-extension://*"]
jwt_expiry = 3600
enable_signup = true

[edge_runtime]
port = 54323
inspector_port = 8083

[analytics]
enabled = false
